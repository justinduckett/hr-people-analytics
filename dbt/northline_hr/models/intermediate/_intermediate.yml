version: 2

models:
  - name: int_peoplecore__person_map
    description: >
      Maps every PeopleCore employment record to a canonical
      person_key. Grain: one row per employee_id. Records sharing a
      person_key are one human. Match rules: shared personal email;
      same name with strictly sequential employment. Concurrent
      same-name records never link.
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null
      - name: person_key
        tests:
          - not_null

  - name: int_talentflow__person_match
    description: >
      Maps each TalentFlow candidate to a canonical person_key where
      one can be justified. Grain: one row per candidate_id. Null
      person_key means no defensible link to any employment record,
      which is the correct verdict for never-hired candidates.
    columns:
      - name: candidate_id
        tests:
          - unique
          - not_null
      - name: is_ambiguous
        tests:
          - accepted_values:
              values: [false]