version: 2

models:
  - name: stg_peoplecore__employees
    description: >
      PeopleCore employment records, cleaned and typed. Grain: one row
      per employment record (employee_id). A rehired person still
      appears as two rows; resolving that is the identity layer's job.
    columns:
      - name: employee_id
        description: PeopleCore's employment record identifier.
        tests:
          - unique
          - not_null
      - name: department
        description: >
          Standardized department name via the department_mapping
          seed. Null means a new unmapped variant appeared in the
          source, which fails the not_null test loudly.
        tests:
          - not_null
      - name: work_email
        tests:
          - not_null

  - name: stg_talentflow__candidates
    description: >
      TalentFlow candidates, cleaned and typed. Grain: one row per
      candidate record. TalentFlow's deduplication is imperfect, so
      one human can hold two candidate records; resolving that is the
      identity layer's job, not staging's.
    columns:
      - name: candidate_id
        tests:
          - unique
          - not_null
      - name: phone
        description: Last 10 digits after stripping formatting (P9 standardization).

  - name: stg_talentflow__applications
    description: >
      One row per application, unnested from the candidates export.
      Offer columns are null for applications that never reached an
      accepted offer.
    columns:
      - name: application_id
        tests:
          - unique
          - not_null
      - name: candidate_id
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['rejected', 'withdrawn', 'in_progress', 'hired']