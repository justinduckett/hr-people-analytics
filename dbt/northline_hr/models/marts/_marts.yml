version: 2

models:
  - name: dim_person
    description: >
      The canonical person record: one row per resolved human being
      who has ever been employed at Northline. Current-state fields
      come from the person's most recent employment record;
      first_hire_date reaches across rehires to their true start.
    columns:
      - name: person_key
        tests:
          - unique
          - not_null
      - name: first_hire_date
        tests:
          - not_null
      - name: is_rehire
        tests:
          - not_null

  - name: dim_date
    description: >
      One row per calendar day from 2015-01-01 through today. The
      spine that point-in-time facts join onto.
    columns:
      - name: date_day
        tests:
          - unique
          - not_null

  - name: fct_headcount_daily
    description: >
      Daily headcount by department and employment type. Grain: one
      row per date per department per employment type with at least
      one employed person. Definition: employed on day D means
      hire_date <= D and (termination_date is null or > D), so the
      termination date itself is the first day NOT counted. Reflects
      current department per record; historical department for
      transferred employees awaits the SCD2 snapshot layer.
    columns:
      - name: date_day
        tests:
          - not_null
      - name: headcount
        tests:
          - not_null

  - name: fct_headcount_monthly
    description: >
      Month-end headcount snapshot by department and employment type.
      One row per month per department per type. Use for trend charts:
      each month has exactly one headcount, sampled on its last
      available day, so no cross-day aggregation is needed.
    columns:
      - name: headcount
        tests:
          - not_null

  - name: fct_headcount_current
    description: >
      Headcount as of the most recent date, by department and
      employment type. Powers all current-state tiles.
    columns:
      - name: headcount
        tests:
          - not_null

  - name: fct_employment_events
    description: >
      Hires and terminations as discrete events. Grain: one row per
      employment event (each employment record contributes one hire,
      and one termination if it has ended). Additive: safe to count
      over any period. The is_rehire_event flag marks a person's
      second or later hire, which is only identifiable after identity
      resolution links employment records the source system keeps
      separate.
    columns:
      - name: event_date
        tests:
          - not_null
      - name: event_type
        tests:
          - accepted_values:
              values: ['hire', 'termination']
      - name: person_key
        tests:
          - not_null

  - name: dim_department
    description: >
      One row per standardized department, with grouping attributes
      for analysis. Sourced from the department_mapping seed, so the
      department list and the source-system spelling standardization
      share one definition. Facts carry department_name directly;
      this dimension is the source of truth for department attributes.
    columns:
      - name: department_name
        tests:
          - unique
          - not_null
      - name: division
        tests:
          - not_null